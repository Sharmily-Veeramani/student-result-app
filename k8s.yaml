apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-result
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-result
  template:
    metadata:
      labels:
        app: student-result
    spec:
      containers:
        - name: student-result
          image: student-result:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-result-service
spec:
  type: NodePort
  selector:
    app: student-result
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080